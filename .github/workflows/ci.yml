name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # The Claude Code mod is checked with Claude Code's own validator and
      # test runner, which need neither a sign-in nor the network. The
      # version is pinned so a new release cannot change what runs.
      - run: npm install --global @anthropic-ai/claude-code@2.1.294
      - run: pnpm --filter @diagram-4-llm/mcp test:plugin
      - run: pnpm --filter @diagram-4-llm/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Tauri's Linux build dependencies, and what the end-to-end test needs:
      # WebKit's WebDriver, a display, and a keychain with secret-tool.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb gnome-keyring libsecret-tools
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked --version 2.1.0
      # The Rust code embeds the web build, so the app is built before it is
      # linted.
      - run: pnpm --filter @diagram-4-llm/desktop tauri build --debug --no-bundle
      - working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: pnpm --filter @diagram-4-llm/desktop e2e
        env:
          DESKTOP_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/debug/diagram-4-llm
