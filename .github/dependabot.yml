version: 2
updates:
  # The npm ecosystem covers the pnpm workspace through the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates in one pull request; each major update gets
      # its own, since it is the kind that needs reading the changelog.
      npm-minor-and-patch:
        update-types: [minor, patch]
  # Actions are pinned to commit SHAs, which only change through updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
